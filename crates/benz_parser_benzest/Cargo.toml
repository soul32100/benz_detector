[package]
name = "benz_parser_benzest"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v5"] }
tracing = "0.1"
regex = "1"

benz_models = { path = "../benz_models" }
benz_core = { path = "../benz_core" }
